<svg viewBox="0 0 320 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="g_blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow_sm" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <radialGradient id="bg_glow" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="320" height="120" fill="#070d1a"/>
  <ellipse cx="60" cy="60" rx="55" ry="55" fill="url(#bg_glow)"/>
  <g transform="translate(60,60)">
    <polygon points="0,-46 40,-23 40,23 0,46 -40,23 -40,-23"
      fill="#0d1525" stroke="url(#g_blue)" stroke-width="1.6" filter="url(#glow)"/>
    <polygon points="0,-36 31,-18 31,18 0,36 -31,18 -31,-18"
      fill="none" stroke="#3b82f610" stroke-width="1"/>
    <path d="M -9,-12 L -9,-23 Q -9,-34 0,-34 Q 9,-34 9,-23 L 9,-12"
      fill="none" stroke="url(#g_blue)" stroke-width="2.2"
      stroke-linecap="round" filter="url(#glow_sm)"/>
    <rect x="-13" y="-14" width="26" height="20" rx="4"
      fill="url(#g_blue)" opacity="0.13"/>
    <rect x="-13" y="-14" width="26" height="20" rx="4"
      fill="none" stroke="url(#g_blue)" stroke-width="1.8" filter="url(#glow_sm)"/>
    <circle cx="0" cy="-6" r="3.5" fill="url(#g_blue)" opacity="0.95"/>
    <rect x="-1.6" y="-6" width="3.2" height="6" rx="1"
      fill="url(#g_blue)" opacity="0.95"/>
    <line x1="-13" y1="-4" x2="-26" y2="-4"
      stroke="#3b82f6" stroke-width="1.4" stroke-dasharray="2.5,2.5" opacity="0.55"/>
    <circle cx="-30" cy="-4" r="3" fill="#3b82f6" opacity="0.8" filter="url(#glow_sm)"/>
    <line x1="13" y1="-4" x2="26" y2="-4"
      stroke="#6366f1" stroke-width="1.4" stroke-dasharray="2.5,2.5" opacity="0.55"/>
    <circle cx="30" cy="-4" r="3" fill="#6366f1" opacity="0.8" filter="url(#glow_sm)"/>
  </g>
  <text x="120" y="52" fill="#f1f5f9" font-size="26" font-weight="300"
    font-family="system-ui,-apple-system,sans-serif" letter-spacing="5">CONNEXY</text>
  <text x="121" y="70" fill="#ffffff35" font-size="8.5"
    font-family="system-ui,-apple-system,sans-serif" letter-spacing="4.5">PRIVATE CONNECTIONS</text>
  <line x1="120" y1="58" x2="296" y2="58"
    stroke="url(#g_blue)" stroke-width="0.6" opacity="0.3"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 320" width="256" height="320">
  <defs>
    <linearGradient id="connexy-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6"/>
      <stop offset="100%" style="stop-color:#8B5CF6"/>
    </linearGradient>
    <linearGradient id="connexy-gradient-subtle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#60A5FA"/>
      <stop offset="100%" style="stop-color:#A78BFA"/>
    </linearGradient>
    <filter id="connexy-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur"/>
      <feFlood flood-color="#3B82F6" flood-opacity="0.5" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="connexy-outer-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4" result="blur"/>
      <feOffset in="blur" dx="0" dy="0" result="offsetBlur"/>
      <feFlood flood-color="#8B5CF6" flood-opacity="0.4" result="color"/>
      <feComposite in="color" in2="offsetBlur" operator="in" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Outer hexagon (back layer) -->
  <polygon
    points="128,32 176,56 176,104 128,128 80,104 80,56"
    fill="none"
    stroke="url(#connexy-gradient)"
    stroke-width="2"
    stroke-opacity="0.6"
    filter="url(#connexy-outer-glow)"
  />
  <!-- Inner hexagon (front layer) - connected/overlapping -->
  <polygon
    points="128,52 164,70 164,98 128,116 92,98 92,70"
    fill="url(#connexy-gradient)"
    fill-opacity="0.9"
    stroke="url(#connexy-gradient-subtle)"
    stroke-width="1.5"
    filter="url(#connexy-glow)"
  />
  <!-- Connection line between layers (optional accent) -->
  <line x1="128" y1="56" x2="128" y2="70" stroke="url(#connexy-gradient-subtle)" stroke-width="1" opacity="0.8"/>
  <!-- Text CONNEXY -->
  <text
    x="128"
    y="200"
    text-anchor="middle"
    fill="url(#connexy-gradient)"
    font-family="system-ui, -apple-system, sans-serif"
    font-size="28"
    font-weight="700"
    letter-spacing="0.35em"
  >CONNEXY</text>
</svg>
