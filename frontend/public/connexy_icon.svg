<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="g_blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow_sm" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <radialGradient id="bg_glow" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="100" height="100" fill="#070d1a"/>
  <ellipse cx="50" cy="50" rx="48" ry="48" fill="url(#bg_glow)"/>
  <g transform="translate(50,50)">
    <polygon points="0,-44 38,-22 38,22 0,44 -38,22 -38,-22"
      fill="#0d1525" stroke="url(#g_blue)" stroke-width="1.8" filter="url(#glow)"/>
    <polygon points="0,-34 29,-17 29,17 0,34 -29,17 -29,-17"
      fill="none" stroke="#3b82f10c" stroke-width="1"/>
    <path d="M -9,-11 L -9,-22 Q -9,-33 0,-33 Q 9,-33 9,-22 L 9,-11"
      fill="none" stroke="url(#g_blue)" stroke-width="2.4"
      stroke-linecap="round" filter="url(#glow_sm)"/>
    <rect x="-13" y="-13" width="26" height="20" rx="4"
      fill="url(#g_blue)" opacity="0.13"/>
    <rect x="-13" y="-13" width="26" height="20" rx="4"
      fill="none" stroke="url(#g_blue)" stroke-width="1.9" filter="url(#glow_sm)"/>
    <circle cx="0" cy="-5" r="3.5" fill="url(#g_blue)" opacity="0.95"/>
    <rect x="-1.6" y="-5" width="3.2" height="6" rx="1"
      fill="url(#g_blue)" opacity="0.95"/>
    <line x1="-13" y1="-3" x2="-25" y2="-3"
      stroke="#3b82f6" stroke-width="1.4" stroke-dasharray="2.5,2.5" opacity="0.6"/>
    <circle cx="-28" cy="-3" r="3" fill="#3b82f6" opacity="0.85" filter="url(#glow_sm)"/>
    <line x1="13" y1="-3" x2="25" y2="-3"
      stroke="#6366f1" stroke-width="1.4" stroke-dasharray="2.5,2.5" opacity="0.6"/>
    <circle cx="28" cy="-3" r="3" fill="#6366f1" opacity="0.85" filter="url(#glow_sm)"/>
  </g>
</svg>

